<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>골프존 견적서</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

body{
  margin:0;
  padding:20px;
  background:#efefef;
  font-family:'Malgun Gothic', sans-serif;
}

/* =========================
   모바일 입력폼
========================= */

.form-area{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

.form-area h2{
  margin-top:0;
  margin-bottom:20px;
}

input, textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#111;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:15px;
  font-weight:bold;
}

/* =========================
   A4 출력 영역
========================= */

.preview-wrapper{
  overflow:auto;
  margin-top:40px;
}

.preview{

  width:210mm;
  min-height:297mm;

  background:#fff;

  margin:auto;

  padding:15mm 12mm;

  box-sizing:border-box;

  color:#000;

  box-shadow:0 0 15px rgba(0,0,0,0.15);

}

/* 제목 */

.doc-title{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  letter-spacing:12px;
  margin-bottom:40px;
}

/* 상단 */

.top-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:25px;
}

.top-table td{
  vertical-align:top;
}

/* 좌측 */

.left-area{
  width:42%;
  font-size:15px;
  line-height:2.3;
}

.notice{
  margin-top:35px;
  font-size:15px;
}

/* 우측 회사정보 */

.company-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.company-table td{
  border:1px solid #000;
  padding:6px 8px;
}

.company-label{
  width:90px;
  background:#f3f3f3;
  font-weight:bold;
}

/* 중간 공급정보 */

.middle-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:25px;
  font-size:14px;
}

.middle-table td{
  padding:5px 0;
}

.middle-label{
  width:100px;
  font-weight:bold;
}

/* 합계 */

.sum-box{
  border:2px solid #000;
  text-align:center;
  padding:20px;
  margin-bottom:30px;
}

.sum-title{
  font-size:18px;
  margin-bottom:12px;
}

.sum-price{
  font-size:32px;
  font-weight:bold;
}

/* 품목 테이블 */

.quote-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.quote-table th,
.quote-table td{
  border:1px solid #000;
  padding:10px 6px;
  text-align:center;
}

.quote-table th{
  background:#f3f3f3;
  font-weight:bold;
}

.total-label{
  text-align:right !important;
  padding-right:15px !important;
  font-weight:bold;
}

.total-price{
  font-size:18px;
  font-weight:bold;
}

/* 특이사항 */

.note-area{
  margin-top:35px;
}

.note-title{
  font-weight:bold;
  margin-bottom:10px;
}

.note-box{
  border:1px solid #000;
  min-height:120px;
  padding:12px;
  line-height:1.8;
  font-size:14px;
}

/* 모바일 */

@media(max-width:768px){

  .preview{
    transform:scale(0.45);
    transform-origin:top center;
    margin-bottom:-700px;
  }

}

</style>
</head>

<body>

<!-- =========================
     모바일 입력폼
========================= -->

<div class="form-area">

<h2>견적서 작성</h2>

<input id="client" placeholder="수신처">
<input id="email" placeholder="이메일">
<input id="phone" placeholder="연락처">

<input id="item" placeholder="품목명">
<input id="detail" placeholder="세부내용">

<input id="price" type="number" placeholder="단가">
<input id="qty" type="number" placeholder="수량">

<textarea id="note" rows="5" placeholder="특이사항"></textarea>

<button onclick="preview()">견적서 미리보기</button>

<button onclick="sendEmail()">이메일 발송</button>

<p id="result"></p>

</div>

<!-- =========================
     A4 미리보기
========================= -->

<div class="preview-wrapper">

<div class="preview" id="preview">

</div>

</div>

<script>

function preview(){

  let client = document.getElementById('client').value || '';
  let email = document.getElementById('email').value || '';
  let phone = document.getElementById('phone').value || '';

  let item = document.getElementById('item').value || '';
  let detail = document.getElementById('detail').value || '';

  let price = Number(document.getElementById('price').value) || 0;
  let qty = Number(document.getElementById('qty').value) || 0;

  let note = document.getElementById('note').value || '';

  let total = price * qty;
  let vat = Math.floor(total * 0.1);
  let final = total + vat;

  let today = new Date().toLocaleDateString();

  document.getElementById('preview').innerHTML = `

    <div class="doc-title">
      見 積 書
    </div>

    <table class="top-table">

      <tr>

        <!-- 좌측 -->

        <td class="left-area">

          <div>
            <strong>수 신 :</strong> ${client}
          </div>

          <div>
            <strong>참 조 :</strong> ${phone}
          </div>

          <div class="notice">
            下記와 같이 見積 드립니다.
          </div>

        </td>

        <!-- 우측 -->

        <td>

          <table class="company-table">

            <tr>
              <td class="company-label">사업자번호</td>
              <td>122-87-00053</td>
            </tr>

            <tr>
              <td class="company-label">회 사 명</td>
              <td>(주)골프존</td>
            </tr>

            <tr>
              <td class="company-label">주 소</td>
              <td>서울특별시 강남구 영동대로 735</td>
            </tr>

            <tr>
              <td class="company-label">대표이사</td>
              <td>박강수</td>
            </tr>

            <tr>
              <td class="company-label">담 당 자</td>
              <td>김만식 센터장</td>
            </tr>

            <tr>
              <td class="company-label">전 화</td>
              <td>010-2382-0313</td>
            </tr>

            <tr>
              <td class="company-label">e-Mail</td>
              <td>kimms@gnsvce.com</td>
            </tr>

          </table>

        </td>

      </tr>

    </table>

    <!-- 공급정보 -->

    <table class="middle-table">

      <tr>
        <td class="middle-label">공급가 :</td>
        <td>₩ ${total.toLocaleString()}</td>
      </tr>

      <tr>
        <td class="middle-label">발행일 :</td>
        <td>${today}</td>
      </tr>

      <tr>
        <td class="middle-label">유효일 :</td>
        <td>견적 후 10일</td>
      </tr>

    </table>

    <!-- 합계 -->

    <div class="sum-box">

      <div class="sum-title">
        견적금액 합계
      </div>

      <div class="sum-price">
        一金 ₩ ${final.toLocaleString()} 원정
      </div>

    </div>

    <!-- 품목 -->

    <table class="quote-table">

      <tr>
        <th>NO</th>
        <th>품명</th>
        <th>세부내용</th>
        <th>단 가</th>
        <th>수량</th>
        <th>금 액</th>
        <th>비고</th>
      </tr>

      <tr>
        <td>1</td>
        <td>${item}</td>
        <td>${detail}</td>
        <td>${price.toLocaleString()}</td>
        <td>${qty}</td>
        <td>${total.toLocaleString()}</td>
        <td>공임포함</td>
      </tr>

      <tr>

        <td colspan="5" class="total-label">
          합계(VAT 포함)
        </td>

        <td colspan="2" class="total-price">
          ₩ ${final.toLocaleString()}
        </td>

      </tr>

    </table>

    <!-- 특이사항 -->

    <div class="note-area">

      <div class="note-title">
        &lt; 특이사항 &gt;
      </div>

      <div class="note-box">
        ${note}
      </div>

    </div>

  `;

}

async function sendEmail(){

  let email = document.getElementById('email').value;

  if(!email || !email.includes('@')){

    alert('올바른 이메일을 입력하세요');
    return;

  }

  try{

    let element = document.getElementById('preview');

    if(!element.innerHTML){
      preview();
    }

    // ✅ 고화질 PNG 생성
    let canvas = await html2canvas(element, {
      scale:3
    });

    let imageData = canvas.toDataURL('image/png');

    let data = {

      client: document.getElementById('client').value,
      email: email,
      image: imageData

    };

    let res = await fetch('/api/send', {

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify(data)

    });

    let result = await res.json();

    if(result.success){

      document.getElementById('result').innerText =
      '✅ 발송 완료';

    }else{

      document.getElementById('result').innerText =
      '❌ 발송 실패';

    }

  }catch(error){

    console.log(error);

    document.getElementById('result').innerText =
    '❌ 서버 오류 발생';

  }

}

</script>

</body>
</html>

<style>

body{

.form-area{

.form-header{

}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
}
  
.header-logo{

}

.header-text{

}

.header-title{

.header-sub{

.add-btn{

.delete-btn{

.mail-box{

.mail-check{

.preview-wrapper{

}
  
.preview-wrapper{

  margin-top:40px;
}

.preview{

  margin:auto;

  box-sizing:border-box;
  color:#000;

}

.top-line{
  height:4px;
  background:#2f5d99;
  margin-bottom:24px;
}

.title-area{
  position:relative;
  margin-bottom:26px;
}

.doc-title{
  text-align:center;

  font-weight:bold;
  letter-spacing:18px;
}

.logo{
  position:absolute;
  right:0;

}

.top-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:8px;

}

.left-area{

  font-size:14px;

.right-area{

.company-table{

.company-table td{

.company-label{

.middle-info{

}

.blue-line{

.sum-table{

  table-layout:fixed;

.sum-table td{

.no-right-border{

.no-left-border{

}

.quote-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:12px;
}

.quote-table th,
.quote-table td{

  text-align:center;

.quote-table th{

}

.blank-row td{

.bottom-total td{

.note-box{

  padding:12px;
  font-size:13px;
  line-height:1.8;

.red{

.footer{

.underline-text{

</style>
</head>

<script>

let itemCount = 0;

function addItem(){

  itemCount++;

  const div = document.createElement('div');

  div.className = 'item-box';

  div.innerHTML = `

    <div class="item-title">
      품목 ${itemCount}
    </div>

    <input class="item-name" placeholder="품목명">

    <input class="item-detail" placeholder="세부내용">

    <input class="item-price" type="number" placeholder="단가">

    <input class="item-qty" type="number" placeholder="수량">

    <input class="item-note" placeholder="비고">

    <button class="delete-btn" onclick="this.parentElement.remove()">
      품목 삭제
    </button>

  `;

  document.getElementById('items').appendChild(div);

}

addItem();

function numberToKorean(num){

  const units = ['', '만', '억', '조'];
  const nums = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const smallUnits = ['', '십', '백', '천'];

  let result = '';
  let unitIndex = 0;

  while(num > 0){

    let chunk = num % 10000;

    if(chunk > 0){

      let chunkText = '';
      let digitIndex = 0;

      while(chunk > 0){

        let digit = chunk % 10;

        if(digit > 0){

          if(!(digit === 1 && digitIndex > 0)){

            chunkText =
            nums[digit] +
            smallUnits[digitIndex] +
            chunkText;

          }else{

            chunkText =
            smallUnits[digitIndex] +
            chunkText;

          }

        }

        chunk = Math.floor(chunk / 10);
        digitIndex++;

      }

      result =
      chunkText +
      units[unitIndex] +
      result;

    }

    num = Math.floor(num / 10000);
    unitIndex++;

  }

  return result || '영';

}

function preview(){

  let client =
  document.getElementById('client').value || '';

  let note =
  document.getElementById('note').value || '';

  let today = new Date().toLocaleDateString();

  const names =
  document.querySelectorAll('.item-name');

  const details =
  document.querySelectorAll('.item-detail');

  const prices =
  document.querySelectorAll('.item-price');

  const qtys =
  document.querySelectorAll('.item-qty');

  const notes =
  document.querySelectorAll('.item-note');

  let rows = '';

  let total = 0;

  for(let i=0; i<names.length; i++){

    let name = names[i].value || '';
    let detail = details[i].value || '';
    let price = Number(prices[i].value) || 0;
    let qty = Number(qtys[i].value) || 0;

    let amount = price * qty;

    total += amount;

    rows += `

      <tr>

        <td>${i+1}</td>
        <td>${name}</td>
        <td>${detail}</td>
        <td>${price.toLocaleString()}</td>
        <td>${qty}</td>
        <td>₩${amount.toLocaleString()}</td>
        <td>${notes[i].value || ''}</td>

      </tr>

    `;

  }

  let vat = Math.floor(total * 0.1);

  let final = total + vat;

  let koreanMoney =
  numberToKorean(final);

  let blankRows = '';

  let remain = 10 - names.length;

  for(let i=0; i<remain; i++){

    blankRows += `
    <tr class="blank-row">
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    `;

  }

  document.getElementById('preview').innerHTML = `

  <div class="top-line"></div>

  <div class="title-area">

    <div class="doc-title">
      見 積 書
    </div>

    <img class="logo" src="logo.png">

  </div>

  <table class="top-table">

    <tr>

      <td class="left-area">

        <div class="underline-text">

          <strong>수&nbsp;&nbsp;신</strong>
          :
          <strong>${client}</strong>

        </div>

       <div>
         참 조 :
         요청 매니저
       </div>

        <div>
          下記와 같이 見積 드립니다.
        </div>

        <div class="middle-info">

          <div class="underline-text">

            <strong>공급가</strong>
            :

            <strong>
            ₩ ${total.toLocaleString()} (VAT 포함)
            </strong>

          </div>

          <div>
            <strong>발행일 :</strong>
            ${today}
          </div>

          <div>
            <strong>유효일 :</strong>
            견적 후 10일
          </div>

        </div>

      </td>

      <td class="right-area">

        <table class="company-table">

          <tr>
            <td class="company-label">사업자번호</td>
            <td>122-87-00053</td>
          </tr>

          <tr>
            <td class="company-label">회 사 명</td>
            <td>(주)골프존</td>
          </tr>

          <tr>
            <td class="company-label">주 소</td>
            <td>서울특별시 강남구 영동대로 735</td>
          </tr>

          <tr>
            <td class="company-label">대표이사</td>
            <td>박강수</td>
          </tr>

        </table>

        <div style="height:10px;"></div>

        <table class="company-table">

          <tr>
            <td class="company-label">담당자</td>
            <td>김만식 센터장</td>
          </tr>

          <tr>
            <td class="company-label">전 화</td>
            <td>010-2382-0313</td>
          </tr>

          <tr>
            <td class="company-label">e-Mail</td>
            <td>kimms@gnsvce.com</td>
          </tr>

        </table>

      </td>

    </tr>

  </table>

  <div class="blue-line"></div>

  <table class="sum-table">

    <tr>

      <td style="width:22%;">
        견적금액 합계
      </td>

      <td style="width:10%;" class="no-right-border">
        一金
      </td>

      font-size:24px;

      </td>

      style="text-align:right; padding-right:15px;">

    </div>

    <div class="red">
      ※ 본 견적서는 "공임비 + VAT" 포함 입니다
    </div>

    </div>

  <div class="footer">
    * 상기 견적에 대하여 외부 유출이 되지 않도록 협조 바랍니다.
  </div>

  <div class="top-line"
  style="margin-top:20px;"></div>

  `;

}

async function sendEmail(){

  const email =
  document.getElementById('email').value;

  if(!email){

    alert('이메일 주소를 입력하세요');
    return;

  }

  const preview =
  document.getElementById('preview');

  const canvas =
  await html2canvas(preview,{

    scale:4,

    useCORS:true,

    backgroundColor:'#ffffff'

  });

  const image =
  canvas.toDataURL('image/png');

  document.getElementById('result').innerText =
  '메일 발송중...';

  try{

    const response =
    await fetch('/api/send',{

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({

  email:email,

  client:
  document.getElementById('client').value,

  fixedManager:
  document.getElementById('fixedManager').checked,

  managerEmail:
  document.getElementById('managerEmail').value,
  
  image:image

})

    });

    const data =
    await response.json();

    if(data.success){

      document.getElementById('result').innerText =
      '발송 완료';

    }else{

      document.getElementById('result').innerText =
      '발송 실패';

    }

  }catch(e){

    document.getElementById('result').innerText =
    '서버 오류 발생';

  }

}

</script>
